name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3, no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version in CMakeLists.txt
        run: |
          # replaces VERSION x.y.z inside the project(...) call, even if it spans several lines
          sed -i -E '/^project\(/,/\)/ s/VERSION [0-9]+(\.[0-9]+)*/VERSION ${{ inputs.version }}/' CMakeLists.txt
          grep -n "VERSION" CMakeLists.txt | head
          git diff --exit-code CMakeLists.txt && echo "::warning::Version unchanged" || true

      - name: Build and test (sanity check before releasing)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit, tag, push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions@github-actions"
          git add CMakeLists.txt
          git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin HEAD --follow-tags

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="${{ github.event.repository.name }}-${{ inputs.version }}/" \
            -o "${{ github.event.repository.name }}-${{ inputs.version }}.tar.gz" "v${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            ./*.tar.gz