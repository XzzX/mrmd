name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3, no leading v)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate existing release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          release_tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            head_commit="$(git rev-parse HEAD)"
            cmake_version="$(sed -nE '/^project\(/,/\)/ s/.*VERSION ([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt)"
            [[ "$tag_commit" == "$head_commit" && "$cmake_version" == "$VERSION" ]] || {
              echo "::error::Tag $release_tag already identifies a different release"
              exit 1
            }
          fi

      - name: Set version in CMakeLists.txt
        run: |
          # replaces VERSION x.y.z inside the project(...) call, even if it spans several lines
          sed -i -E '/^project\(/,/\)/ s/VERSION [0-9]+(\.[0-9]+)*/VERSION ${{ inputs.version }}/' CMakeLists.txt
          grep -n "VERSION" CMakeLists.txt | head
          git diff --exit-code CMakeLists.txt && echo "::warning::Version unchanged" || true

      - name: Check that validate pipeline passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --workflow validate.yml --commit "$sha" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          [[ "$conclusion" -ge 1 ]] || {
            echo "::error::No successful validate run found for commit $sha"
            exit 1
          }

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions@github-actions"
          git add CMakeLists.txt
          git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}"
          git push origin HEAD

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="${{ github.event.repository.name }}-${{ inputs.version }}/" \
            -o "${{ github.event.repository.name }}-${{ inputs.version }}.tar.gz" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v${{ inputs.version }}"
          archive="${{ github.event.repository.name }}-${{ inputs.version }}.tar.gz"
          target_commit="$(git rev-parse HEAD)"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$archive" --clobber
          else
            gh release create "$release_tag" "$archive" \
              --title "$release_tag" \
              --generate-notes \
              --target "$target_commit"
          fi